<!doctype html>
<html><head><meta charset="utf-8"><title>Stickman Player</title>
<style>html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center}
canvas{height:100vh;aspect-ratio:9/16;background:#fff}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script>
  // usage: player.html?v=videos/demo.js   (preview in real time; the renderer calls window.drawAt(t) instead)
  const params = new URLSearchParams(location.search);
  const s = document.createElement('script');
  s.src = params.get('v') || 'videos/demo.js';
  s.onload = () => {
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    ctx.scale(2, 2);
    const vid = Stick.makeVideo(window.VIDEO, c);
    window.TOTAL = vid.total;
    window.drawAt = (t) => { ctx.setTransform(2, 0, 0, 2, 0, 0); vid.draw(t); };
    window.READY = true;
    if (!params.has('render')) { const t0 = performance.now(); (function loop() { drawAt(((performance.now() - t0) / 1000) % vid.total); requestAnimationFrame(loop); })(); }
  };
  document.body.appendChild(s);
</script></body></html>
