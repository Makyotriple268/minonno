<!doctype html>
<html><head><meta charset="utf-8"><title>Studio Player</title>
<style>html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center}canvas{max-width:100vw;max-height:100vh;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script><script src="props.js"></script><script src="data.js"></script><script src="framework.js"></script><script src="scenes_a.js"></script><script src="scenes_b.js"></script>
<script>
  // ?v=milk.js  -> scenes file defining window.SCENES = [{audio,dur,draw(ctx,t,env)}] ; ?render=1 for headless stepping
  const q = new URLSearchParams(location.search), s = document.createElement('script'); s.src = q.get('v') || 'milk.js';
  s.onload = () => {
    const c = document.getElementById('c'), ctx = c.getContext('2d'); const S = Studio;
    if (q.has('render')) { c.style.width = '1920px'; c.style.height = '1080px'; c.style.maxWidth = c.style.maxHeight = 'none'; document.body.style.display = 'block'; document.body.style.height = 'auto'; }
    window.TOTAL = window.TIMELINE.total; window.PX = [1920, 1080];
    window.drawAt = (T) => { ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, S.W, S.H); window.TIMELINE.draw(ctx, T); };
    window.READY = true;
    if (!q.has('render')) { const t0 = performance.now(); (function loop() { drawAt(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); })(); }
  };
  document.body.appendChild(s);
</script></body></html>
